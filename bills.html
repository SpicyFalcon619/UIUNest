<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mess Bills - UIUNest</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="data.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="nav-mount"></div>

<div class="container" id="contentMount"></div>

<div id="footer-mount"></div>
<script src="app.js"></script>
<script>
mountChrome('dashboard');

const root = document.getElementById('contentMount');
const user = window.mockData.currentUser;

let userListings = [];
let activeListing = null;
let activeBills = [];

if (!isLoggedIn()) {
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card" style="max-width:420px;width:100%">
        <h1>Please log in</h1>
        <p class="subtitle">You need to be logged in to view Mess Bills.</p>
        <a class="btn btn-primary btn-block" href="login.html">Log In</a>
      </div>
    </div>`;
} else {
  initBillsData();
}

async function initBillsData() {
  try {
    const listRes = await fetch('api/listings.php');
    const listData = await listRes.json();
    if (listData.success) {
      userListings = listData.listings.filter(l => l.ownerEmail === user.email);
    }
    
    if (userListings.length === 0) {
      root.innerHTML = `
        <div style="text-align:center;padding:80px 20px;background:white;border-radius:var(--radius-lg);border:1px solid var(--border)">
          <h2 style="color:var(--navy)">No Managed Properties</h2>
          <p style="color:var(--gray)">You do not have any property listings to manage bills for. Only owners or managers of a listing can log bills.</p>
          <a class="btn btn-primary" href="listings.html" style="margin-top:14px">List a Property Now</a>
        </div>`;
      return;
    }

    let activeListingId = parseInt(getQueryId()) || userListings[0].id;
    activeListing = userListings.find(l => l.id === activeListingId) || userListings[0];

    await fetchBills(activeListing.id);
  } catch (err) {
    console.error(err);
    root.innerHTML = `<p style="text-align:center;color:red;padding:40px;">Failed to load data.</p>`;
  }
}

async function fetchBills(listingId) {
  try {
    const res = await fetch('api/bills.php?listing_id=' + listingId);
    const data = await res.json();
    if (data.success) {
      activeBills = data.bills;
      renderBillManager(userListings, activeListing, activeBills);
    }
  } catch(err) {
    console.error(err);
  }
}

function renderBillManager(myProps, activeListing, activeBills) {
  // Generate selector for property listings
  const propOptions = myProps.map(l => `<option value="${l.id}" ${l.id === activeListing.id ? 'selected' : ''}>${l.title}</option>`).join('');

  // Months available to log
  const months = [
    { val: "2026-01", label: "January 2026" },
    { val: "2026-02", label: "February 2026" },
    { val: "2026-03", label: "March 2026" },
    { val: "2026-04", label: "April 2026" },
    { val: "2026-05", label: "May 2026" },
    { val: "2026-06", label: "June 2026" },
    { val: "2026-07", label: "July 2026" },
    { val: "2026-08", label: "August 2026" },
    { val: "2026-09", label: "September 2026" },
    { val: "2026-10", label: "October 2026" },
    { val: "2026-11", label: "November 2026" },
    { val: "2026-12", label: "December 2026" }
  ];
  const monthOptions = months.map(m => `<option value="${m.val}">${m.label}</option>`).join('');

  root.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;">
      <h1 class="page-title" style="margin:0">Mess Bill Manager</h1>
      <div style="display:flex;gap:8px;align-items:center;">
        <label style="font-weight:600;font-size:13px;">Manage Flat:</label>
        <select id="propSelect" onchange="switchProperty(this.value)" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;">
          ${propOptions}
        </select>
      </div>
    </div>
    <h2 style="font-size:16px;color:var(--gray);font-weight:500;margin:0 0 18px"><i data-lucide="map-pin" class="lucide-sm"></i> ${activeListing.title} (${activeListing.zone})</h2>

    <div class="grid-2">
      <!-- Create/Edit Bill Card -->
      <div class="card">
        <h3 style="margin:0 0 14px;color:var(--navy)">Enter Monthly Bills</h3>
        <form onsubmit="saveBill(event, ${activeListing.id})">
          <div class="form-group">
            <label>Month</label>
            <select id="b_month" required style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border)">
              ${monthOptions}
            </select>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>Electricity (৳)</label><input type="number" class="bill-in" id="b_electricity" min="0" value="600" required></div>
            <div class="form-group"><label>Gas (৳)</label><input type="number" class="bill-in" id="b_gas" min="0" value="200" required></div>
            <div class="form-group"><label>Water (৳)</label><input type="number" class="bill-in" id="b_water" min="0" value="100" required></div>
            <div class="form-group"><label>Internet (৳)</label><input type="number" class="bill-in" id="b_internet" min="0" value="500" required></div>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>Base Rent (৳)</label><input type="number" class="bill-in" id="b_rent" value="${activeListing.costs ? activeListing.costs.baseRent : 0}" readonly style="background:#f3f4f6;"></div>
            <div class="form-group"><label>Occupants to split by</label><input type="number" class="bill-in" id="b_occupancy" min="1" value="${activeListing.currentOccupancy || 3}" required></div>
          </div>
          
          <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:12px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
              <label style="font-weight:600;margin:0">Extra Fees</label>
              <button type="button" class="btn btn-outline btn-sm" onclick="addCustomFee()">+ Add Fee</button>
            </div>
            <div id="customFeesContainer">
              <!-- Dynamically added fees will go here -->
            </div>
          </div>
          
          <div style="background:var(--light-bg);padding:14px;border-radius:8px;border-left:3px solid var(--navy);margin-top:8px">
            <div style="font-weight:700;font-size:18px;color:var(--navy)">Total: <span id="liveTotal">৳1,400</span></div>
            <div style="font-size:14px;color:var(--gray);margin-top:4px">
              Per Person: <strong id="livePerPerson">৳467</strong>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:12px">Log & Save Month's Bills</button>
        </form>
      </div>

      <!-- Payment Tracker Card -->
      <div class="card">
        <h3 style="margin:0 0 10px;color:var(--navy)">Payment Tracker</h3>
        <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:8px;">
            <label style="font-size:13px;font-weight:600">Select Month to Track:</label>
            <select id="trackMonthSel" onchange="loadTrackerMonth(this.value, ${activeListing.id})" style="padding:6px;border-radius:6px;border:1px solid var(--border)">
              ${activeBills.length ? activeBills.map(b => `<option value="${b.id}">${b.month}</option>`).join('') : '<option value="">No bills logged</option>'}
            </select>
          </div>
          <button type="button" class="btn btn-danger btn-sm" id="deleteBillBtn" onclick="deleteBillMonth(${activeListing.id})" style="display:none;"><i data-lucide="trash-2" class="lucide-sm"></i> Delete Log</button>
        </div>
        <table class="table">
          <thead><tr><th>Resident</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="payTbody">
            <tr><td colspan="4" style="text-align:center;color:var(--gray);">Select or log a bill month first.</td></tr>
          </tbody>
        </table>
        <div style="margin-top:10px;font-size:14px;color:var(--gray)" id="paySummary"></div>
      </div>
    </div>

    <!-- Bill History Log -->
    <div class="card" style="margin-top:20px">
      <h3 style="margin:0 0 14px;color:var(--navy)">Bill History Log</h3>
      ${activeBills.length === 0 ? `
        <p style="color:var(--gray);text-align:center;padding:24px 0">No bills have been logged for this property yet.</p>
      ` : `
        <table class="table">
          <thead><tr><th>Month</th><th>Rent</th><th>Utilities</th><th>Extra Fees</th><th>Total</th><th>Split</th><th>Payments Paid</th></tr></thead>
          <tbody>
            ${activeBills.map(b => {
              const paidCount = b.payments.filter(p => p.status === 'paid').length;
              const utils = b.electricity + b.gas + b.water + b.internet;
              const feesHtml = (b.customFees && b.customFees.length > 0) 
                  ? b.customFees.map(f => `${f.name}: ${fmt(f.amount)}`).join('<br>') 
                  : '-';
              const feesSum = b.customFees ? b.customFees.reduce((s,f) => s + f.amount, 0) : 0;
              const rentExtracted = b.total - utils - feesSum;
              return `
                <tr>
                  <td><strong>${b.month}</strong></td>
                  <td>${fmt(rentExtracted > 0 ? rentExtracted : 0)}</td>
                  <td>${fmt(utils)}</td>
                  <td style="font-size:12px;color:var(--gray)">${feesHtml}</td>
                  <td><strong>${fmt(b.total)}</strong></td>
                  <td>${fmt(b.perPerson)}</td>
                  <td>${paidCount} / ${b.payments.length} paid</td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      `}
    </div>

    <!-- Custom Confirm Modal -->
    <div class="modal-bg" id="confirmModal">
      <div class="modal" style="max-width:400px;text-align:center;">
        <h3 style="margin-top:0;color:var(--navy)">Confirm Deletion</h3>
        <p style="color:var(--gray);margin-bottom:20px;">Are you sure you want to completely delete the log for this month? This cannot be undone.</p>
        <div style="display:flex;gap:12px;justify-content:center;">
          <button class="btn btn-outline" onclick="document.getElementById('confirmModal').classList.remove('open')">Cancel</button>
          <button class="btn btn-danger" id="confirmActionBtn">Yes, Delete</button>
        </div>
      </div>
    </div>
  `;

  // Attach recalc handlers
  document.querySelectorAll('.bill-in').forEach(i => i.addEventListener('input', recalcLive));
  recalcLive();

  // Load payment tracker for default month if exists
  if (activeBills.length > 0) {
    loadTrackerMonth(activeBills[0].id, activeListing.id);
  }
  if (window.lucide) lucide.createIcons();
  
  // Initialize custom styled dropdowns for the dynamically injected selects
  if (typeof initCustomSelects === 'function') {
    initCustomSelects();
  }
}

function switchProperty(id) {
  location.href = `bills.html?id=${id}`;
}

function addCustomFee() {
  const container = document.getElementById('customFeesContainer');
  const row = document.createElement('div');
  row.style = "display:flex;gap:10px;align-items:end;margin-bottom:8px;";
  row.innerHTML = `
    <div style="flex-grow:1"><input type="text" class="custom-fee-name" placeholder="Fee Name (e.g. Maid)" required style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px"></div>
    <div style="flex-grow:1"><input type="number" class="bill-in custom-fee-amt" placeholder="Amount (৳)" min="0" required style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px"></div>
    <button type="button" class="btn btn-outline btn-sm" onclick="this.parentElement.remove(); recalcLive()" style="padding:8px;border-color:var(--danger);color:var(--danger)"><i data-lucide="x" class="lucide-sm"></i></button>
  `;
  container.appendChild(row);
  if(window.lucide) lucide.createIcons();
  
  // Attach listener to new input
  row.querySelector('.custom-fee-amt').addEventListener('input', recalcLive);
}

function recalcLive() {
  const ids = ['b_rent','b_electricity','b_gas','b_water','b_internet'];
  let total = ids.reduce((s,i) => s + (parseFloat(document.getElementById(i).value) || 0), 0);
  
  document.querySelectorAll('.custom-fee-amt').forEach(el => {
    total += parseFloat(el.value) || 0;
  });

  const occupancy = parseInt(document.getElementById('b_occupancy').value) || 1;
  document.getElementById('liveTotal').textContent = fmt(total);
  document.getElementById('livePerPerson').textContent = fmt(Math.round(total / occupancy));
}

async function saveBill(e, listingId) {
  e.preventDefault();
  const month = document.getElementById('b_month').value;
  const electricity = parseInt(document.getElementById('b_electricity').value) || 0;
  const gas = parseInt(document.getElementById('b_gas').value) || 0;
  const water = parseInt(document.getElementById('b_water').value) || 0;
  const internet = parseInt(document.getElementById('b_internet').value) || 0;
  const rent = parseInt(document.getElementById('b_rent').value) || 0;
  const occupancy = parseInt(document.getElementById('b_occupancy').value) || 1;

  const customFees = [];
  const feeRows = document.getElementById('customFeesContainer').children;
  for(let i=0; i<feeRows.length; i++) {
    const name = feeRows[i].querySelector('.custom-fee-name').value;
    const amount = parseInt(feeRows[i].querySelector('.custom-fee-amt').value) || 0;
    if (name && amount > 0) {
      customFees.push({name, amount});
    }
  }

  const customFeesSum = customFees.reduce((s,f) => s + f.amount, 0);
  const total = rent + electricity + gas + water + internet + customFeesSum;
  const perPerson = Math.round(total / occupancy);

  const payload = {
    listingId, month, electricity, gas, water, internet, customFees, total, perPerson, occupancy
  };

  try {
    const res = await fetch('api/bills.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success) {
      showToast('Month bill logged!');
      await fetchBills(listingId); // refresh
    } else {
      showToast(data.error || 'Failed to log bill', 'error');
    }
  } catch(err) {
    showToast('Network error', 'error');
  }
}

function loadTrackerMonth(billId, listingId) {
  const btn = document.getElementById('deleteBillBtn');
  if (!billId) {
    if(btn) btn.style.display = 'none';
    return;
  }
  
  if(btn) btn.style.display = 'inline-block';
  
  const bill = activeBills.find(b => b.id === parseInt(billId));
  if (!bill) return;

  const tbody = document.getElementById('payTbody');
  const summary = document.getElementById('paySummary');

  tbody.innerHTML = bill.payments.map((p, idx) => `
    <tr>
      <td>${p.resident}</td>
      <td>${fmt(bill.perPerson)}</td>
      <td>${p.status === 'paid' ? '<span class="badge badge-green"><i data-lucide="check-circle" class="lucide-sm"></i> Paid</span>' : '<span class="badge badge-amber"><i data-lucide="clock" class="lucide-sm"></i> Unpaid</span>'}</td>
      <td>${p.status === 'unpaid' ? `<button class="btn btn-success btn-sm" onclick="markPaidLocal(${bill.id}, ${p.id}, ${listingId})">Mark Paid</button>` : '-'}</td>
    </tr>`).join('');

  const paidCount = bill.payments.filter(p => p.status === 'paid').length;
  summary.textContent = `${paidCount} of ${bill.payments.length} occupants paid (${fmt(paidCount * bill.perPerson)} / ${fmt(bill.payments.length * bill.perPerson)})`;
  if (window.lucide) lucide.createIcons();
}

async function deleteBillMonth(listingId) {
  const billId = document.getElementById('trackMonthSel').value;
  if (!billId) return;

  const modal = document.getElementById('confirmModal');
  modal.classList.add('open');
  
  document.getElementById('confirmActionBtn').onclick = async () => {
    modal.classList.remove('open');
    try {
      const res = await fetch('api/bills.php', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({billId})
      });
      const data = await res.json();
      if (data.success) {
        showToast('Bill log deleted');
        await fetchBills(listingId);
      } else {
        showToast(data.error || 'Failed to delete bill', 'error');
      }
    } catch(err) {
      showToast('Network error', 'error');
    }
  };
}

async function markPaidLocal(billId, paymentId, listingId) {
  try {
    const res = await fetch('api/bills.php', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({paymentId})
    });
    const data = await res.json();
    if (data.success) {
      showToast('Payment marked as paid');
      await fetchBills(listingId);
    } else {
      showToast(data.error || 'Failed to update payment', 'error');
    }
  } catch(err) {
    showToast('Network error', 'error');
  }
}
</script>
</body>
</html>
