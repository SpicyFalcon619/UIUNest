<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Looking For - UIUNest</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="data.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="nav-mount"></div>

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:16px">
    <h1 class="page-title" style="margin:0">Looking For - roommate requests</h1>
    <button class="btn btn-gold" onclick="openRequestModal()">+ Post a Request</button>
  </div>

  <div class="card" style="margin-bottom:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:end">
    <div class="form-group" style="margin:0"><label>Zone</label><select id="fZone"><option value="all">All</option></select></div>
    <div class="form-group" style="margin:0"><label>Room type</label><select id="fRoom"><option value="all">Any</option><option value="single">Single</option><option value="shared">Shared</option></select></div>
    <div class="form-group" style="margin:0;min-width:200px"><label>Max budget: <span id="bVal">৳10,000</span></label><input type="range" id="fBudget" min="2000" max="10000" step="500" value="10000"></div>
    <div class="form-group" style="margin:0"><label>Gender</label><select id="fGender"><option value="all">Any</option><option value="male">Male</option><option value="female">Female</option></select></div>
  </div>

  <div id="postsList"></div>
</div>

<div class="modal-bg" id="postModal">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('postModal').classList.remove('open')">×</button>
    <h3>Post a request</h3>
    <form onsubmit="addPost(event)">
      <div class="form-group"><label>Zone</label><select id="pZone"></select></div>
      <div class="grid-2">
        <div class="form-group"><label>Budget min (৳)</label><input type="number" id="pMin" required value="3000"></div>
        <div class="form-group"><label>Budget max (৳)</label><input type="number" id="pMax" required value="5000"></div>
      </div>
      <div class="form-group"><label>Room type</label>
        <select id="pRoom"><option value="any">Any</option><option value="single">Single</option><option value="shared">Shared</option></select>
      </div>
      <div class="form-group"><label>Gender preference</label>
        <div class="radio-row">
          <label><input type="radio" name="pg" value="male" checked> Male</label>
          <label><input type="radio" name="pg" value="female"> Female</label>
          <label><input type="radio" name="pg" value="any"> Any</label>
        </div>
      </div>
      <div class="form-group"><label>Move-in date</label><input type="date" id="pDate" required></div>
      <div class="form-group"><label>Requirements</label><textarea id="pReq" required placeholder="Quiet, clean, study-focused roommate needed..."></textarea></div>
      <button class="btn btn-primary btn-block">Post Request</button>
    </form>
  </div>
</div>

<div id="footer-mount"></div>
<script src="app.js"></script>
<script>
mountChrome('seeking');

const fZoneOpts = mockData.zones.map(z => `<option value="${z.name}">${z.name}</option>`).join('');
const pZoneOpts = mockData.zones.map(z => `<option value="${z.id}">${z.name}</option>`).join('');
document.getElementById('fZone').innerHTML += fZoneOpts;
document.getElementById('pZone').innerHTML = pZoneOpts;

window.posts = [];

async function loadPosts() {
  try {
    const res = await fetch('api/seeking.php');
    const data = await res.json();
    if (data.success) {
      window.posts = data.posts;
      renderPosts();
    }
  } catch (err) {
    console.error(err);
  }
}

function renderPosts() {
  const zone = document.getElementById('fZone').value;
  const room = document.getElementById('fRoom').value;
  const budget = parseInt(document.getElementById('fBudget').value);
  const gender = document.getElementById('fGender').value;

  const r = window.posts.filter(p => {
    if (zone !== 'all' && p.zone !== zone) return false;
    if (room !== 'all' && p.roomType !== room) return false;
    if (gender !== 'all' && p.preferredGender !== gender) return false;
    if (p.budgetMin > budget) return false;
    return true;
  });

  document.getElementById('postsList').innerHTML = r.map(p => {
    const initials = (p.user || '').split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
    return `
    <div class="seek-card">
      <div class="seek-avatar">${initials}</div>
      <div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <strong>${p.user}</strong>
          <span style="color:var(--gray);font-size:12px">${p.moveInDate ? 'Move in: ' + p.moveInDate : ''}</span>
          ${statusBadge(p.status)}
        </div>
        <div style="margin:8px 0" class="badges">
          <span class="budget-badge">${fmt(p.budgetMin)}–${fmt(p.budgetMax)}</span>
          <span class="badge badge-navy">${p.zone}</span>
          <span class="badge badge-blue">${p.roomType}</span>
          <span class="badge badge-gray">${p.genderPref}</span>
        </div>
        <div style="font-size:14px;margin-top:6px;font-weight: 500;">${p.requirements}</div>
      </div>
      ${isLoggedIn() ? `<button class="btn btn-primary btn-sm" onclick="showToast('Response sent to ${p.user}!')">Respond</button>` : ''}
    </div>`}).join('') || '<p style="color:var(--gray); text-align: center; padding: 40px 0;">No active flatmate requests found. Be the first to post!</p>';
  if (window.lucide) lucide.createIcons();
}

function openRequestModal() {
  if (!isLoggedIn()) {
    showToast('Please log in first!', 'error');
    setTimeout(() => { location.href = 'login.html'; }, 1000);
    return;
  }
  document.getElementById('postModal').classList.add('open');
}

async function addPost(e) {
  e.preventDefault();
  
  const payload = {
    zone_id: parseInt(document.getElementById('pZone').value),
    budgetMin: parseInt(document.getElementById('pMin').value),
    budgetMax: parseInt(document.getElementById('pMax').value),
    roomType: document.getElementById('pRoom').value,
    genderPref: document.querySelector('input[name=pg]:checked').value,
    moveInDate: document.getElementById('pDate').value,
    requirements: document.getElementById('pReq').value.trim()
  };

  try {
    const res = await fetch('api/seeking.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('postModal').classList.remove('open');
      document.getElementById('postModal').querySelector('form').reset();
      showToast('Request posted successfully!');
      loadPosts(); // reload live data
    } else {
      showToast(data.error || 'Failed to post request', 'error');
    }
  } catch (err) {
    showToast('Network error', 'error');
  }
}

document.getElementById('fBudget').addEventListener('input', e => document.getElementById('bVal').textContent = fmt(e.target.value));
document.querySelectorAll('#fZone,#fRoom,#fBudget,#fGender').forEach(el => el.addEventListener('change', renderPosts));

loadPosts();
</script>
</body>
</html>
