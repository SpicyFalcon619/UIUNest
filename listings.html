<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browse Listings - UIUNest</title>
<link rel="stylesheet" href="style.css?v=7">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="data.js?v=2"></script>
</head>
<body>
<div id="nav-mount"></div>

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h1 class="page-title" style="margin:0">Browse Listings</h1>
    <div id="listBtnMount"></div>
  </div>
  <div class="listings-layout">
    <!-- Mobile filter toggle button -->
    <button class="mobile-filter-btn" onclick="this.classList.toggle('active'); document.querySelector('.sidebar').classList.toggle('sidebar-open'); if(window.lucide) lucide.createIcons();" aria-expanded="false">
      <i data-lucide="sliders-horizontal" style="width:16px;height:16px"></i>
      <span>Filters &amp; Sort</span>
      <i data-lucide="chevron-down" class="filter-chevron" style="width:16px;height:16px;margin-left:auto;transition:transform 0.3s ease"></i>
    </button>
    <aside class="sidebar">
      <h4>Zone</h4>
      <div id="zoneFilters"></div>

      <h4>Property type</h4>
      <label><input type="checkbox" class="ptype" value="single_room"> Single Room</label>
      <label><input type="checkbox" class="ptype" value="shared_room"> Shared Room</label>
      <label><input type="checkbox" class="ptype" value="full_mess"> Full Mess</label>
      <label><input type="checkbox" class="ptype" value="sublet"> Sub-let</label>

      <h4>Listing type</h4>
      <label><input type="radio" name="ltype" value="all" checked> All</label>
      <label><input type="radio" name="ltype" value="Landlord Listed"> Landlord Listed</label>
      <label><input type="radio" name="ltype" value="Student Listed"> Student Listed</label>

      <h4>Max monthly cost: <span class="range-val" id="budgetVal">৳15,000</span></h4>
      <input type="range" id="budget" min="1000" max="15000" step="500" value="15000">



      <h4>Amenities</h4>
      <label><input type="checkbox" class="amen" value="attachedBathroom"> Attached Bathroom</label>
      <label><input type="checkbox" class="amen" value="attachedKitchen"> Kitchen</label>
      <label><input type="checkbox" class="amen" value="isFurnished"> Furnished</label>
      <label><input type="checkbox" class="amen" value="rooftopAccess"> Rooftop</label>
      <label><input type="checkbox" class="amen" value="powerBackup"> Power Backup</label>
      <label><input type="checkbox" class="amen" value="liftAccess"> Lift</label>


      <h4>Sort by</h4>
      <select id="sort" class="form-group" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px">
        <option value="cost_asc">Total Cost ↑</option>
        <option value="cost_desc">Total Cost ↓</option>
        <option value="newest">Newest</option>
        <option value="rating">Rating</option>
      </select>

      <div style="margin-top:18px;display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" onclick="applyFilters()">Apply</button>
        <button class="btn btn-outline btn-sm" onclick="resetFilters()">Reset</button>
      </div>
    </aside>

    <main>
      <div style="margin-bottom:12px;color:var(--gray);font-size:14px" id="countLabel">Showing 6 listings</div>
      <div class="grid-2" id="listingsGrid"></div>
      <div id="map"></div>
    </main>
  </div>
</div>

<!-- Create Listing Modal -->
<div class="modal-bg" id="createListingModal">
  <div class="modal" style="max-width: 650px;">
    <button class="modal-close" onclick="document.getElementById('createListingModal').classList.remove('open')">×</button>
    <h3>List a Property</h3>
    <form id="createListingForm" onsubmit="saveNewListing(event)">
      <div style="font-weight: 700; color: var(--navy); margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px;">Basic Details</div>
      <div class="form-group"><label>Title</label><input type="text" id="lstTitle" required placeholder="e.g. Spacious Single Room near UIU Campus"></div>
      <div class="grid-2">
        <div class="form-group"><label>Zone</label>
          <select id="lstZone" required></select>
        </div>
        <div class="form-group"><label>Property Type</label>
          <select id="lstType" required>
            <option value="single_room">Single Room</option>
            <option value="shared_room">Shared Room</option>
            <option value="full_mess">Full Mess</option>
            <option value="sublet">Sub-let</option>
          </select>
        </div>
      </div>
      <div class="grid-3">
        <div class="form-group"><label>Total Rooms</label><input type="number" id="lstRooms" required min="1" value="3"></div>
        <div class="form-group"><label>Current Occupancy</label><input type="number" id="lstOccupancy" required min="0" value="1"></div>

      </div>
      <div class="form-group"><label>Address</label><input type="text" id="lstAddress" required placeholder="e.g. House 45, Road 2, Vatara, Dhaka"></div>
      <div class="form-group"><label>Description</label><textarea id="lstDescription" required placeholder="Describe your property in detail..."></textarea></div>
      <div class="grid-2">
        <div class="form-group"><label>Latitude (Optional)</label><input type="number" step="any" id="lstLat" placeholder="e.g. 23.7900"></div>
        <div class="form-group"><label>Longitude (Optional)</label><input type="number" step="any" id="lstLng" placeholder="e.g. 90.4100"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label>Thumbnail Image (Required)</label><input type="file" id="lstThumbnail" accept="image/*" required style="padding: 8px; border: 1px solid var(--border); border-radius: 6px; width: 100%;"></div>
        <div class="form-group"><label>Gallery Photos (Optional)</label><input type="file" id="lstPhoto" accept="image/*" multiple style="padding: 8px; border: 1px solid var(--border); border-radius: 6px; width: 100%;"></div>
      </div>

      <div style="font-weight: 700; color: var(--navy); margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-top: 14px;">Monthly Costs</div>
      <div class="grid-2">
        <div class="form-group"><label>Base Rent (৳)</label><input type="number" id="lstBaseRent" required min="0"></div>
        <div class="form-group"><label>Gas Bill (৳)</label><input type="number" id="lstGas" required min="0" value="0"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label>Electricity Meter Type</label>
          <select id="lstElecType" required>
            <option value="individual">Individual Meter</option>
            <option value="shared">Shared Meter</option>
          </select>
        </div>
        <div class="form-group"><label>Estimated Electricity Cost (৳)</label><input type="number" id="lstElec" required min="0" value="0"></div>
      </div>
      <div class="grid-3">
        <div class="form-group"><label>Water Bill (৳)</label><input type="number" id="lstWater" required min="0" value="0"></div>
        <div class="form-group"><label>Internet Cost (৳)</label><input type="number" id="lstInternet" required min="0" value="0"></div>
        <div class="form-group"><label>Maintenance (৳)</label><input type="number" id="lstMaint" required min="0" value="0"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label>Caretaker Fee (৳)</label><input type="number" id="lstCaretaker" required min="0" value="0"></div>
      </div>
      
      <div style="font-weight: 700; color: var(--navy); margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-top: 14px; display: flex; justify-content: space-between; align-items: center;">
        <span>Custom / Other Fees (Optional)</span>
        <button type="button" class="btn btn-outline btn-sm" style="padding:4px 8px;font-size:12px" onclick="addCustomFee()">+ Add Custom Fee</button>
      </div>
      <div id="customFeesContainer"></div>

      <div style="font-weight: 700; color: var(--navy); margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-top: 14px;">Amenities</div>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px;">
        <label><input type="checkbox" id="lstAmenBath"> Attached Bath</label>
        <label><input type="checkbox" id="lstAmenKitchen"> Kitchen</label>
        <label><input type="checkbox" id="lstAmenFurnished"> Furnished</label>
        <label><input type="checkbox" id="lstAmenRooftop"> Rooftop Access</label>
        <label><input type="checkbox" id="lstAmenPower"> Power Backup</label>
        <label><input type="checkbox" id="lstAmenLift"> Lift</label>
        <label><input type="checkbox" id="lstAmenParking"> Parking</label>
      </div>

      <div style="font-weight: 700; color: var(--navy); margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-top: 14px;">Resident Preferences (For Matching)</div>
      <div class="grid-2">
        <div class="form-group"><label>Sleep Schedule</label>
          <select id="lstPrefSleep" required>
            <option value="Flexible">Flexible</option>
            <option value="Early Bird (before 11pm)">Early Bird (before 11pm)</option>
            <option value="Night Owl (after 12am)">Night Owl (after 12am)</option>
          </select>
        </div>
        <div class="form-group"><label>Diet</label>
          <select id="lstPrefDiet" required>
            <option value="Non-Vegetarian">Non-Vegetarian</option>
            <option value="Vegetarian">Vegetarian</option>
            <option value="Strictly Halal">Strictly Halal</option>
          </select>
        </div>
      </div>
      <div class="grid-3">
        <div class="form-group"><label>Guests</label>
          <select id="lstPrefGuest" required>
            <option value="Allowed">Allowed</option>
            <option value="Restricted (weekends only)">Restricted</option>
            <option value="Not Allowed">Not Allowed</option>
          </select>
        </div>
        <div class="form-group"><label>Cleanliness Standard (1-5)</label>
          <input type="number" id="lstPrefClean" required min="1" max="5" value="4">
        </div>
        <div class="form-group"><label>Noise Level</label>
          <select id="lstPrefNoise" required>
            <option value="Quiet">Quiet</option>
            <option value="Moderate">Moderate</option>
            <option value="Lively is fine">Lively is fine</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label><input type="checkbox" id="lstPrefSmoking"> Prefers Non-Smoking Environment</label>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Publish Listing</button>
    </form>
  </div>
</div>

<div id="footer-mount"></div>
<script src="app.js"></script>
<script>
mountChrome('listings');

window.user = null;
let allListings = [];

async function checkUserAndLoad() {
  try {
    const res = await fetch('api/me.php');
    const data = await res.json();
    if (data.loggedIn) {
      window.user = data.user;
      if (window.user.role === 'student' || window.user.role === 'landlord') {
        document.getElementById('listBtnMount').innerHTML = `<button class="btn btn-gold" onclick="openCreateListingModal()">+ List Property</button>`;
      }
    }
  } catch(e) {}
  
  try {
    const lRes = await fetch('api/listings.php');
    const lData = await lRes.json();
    if (lData.success) {
      allListings = lData.listings;
    }
  } catch(e) {}
  
  applyFilters();
}
checkUserAndLoad();

document.getElementById('zoneFilters').innerHTML = mockData.zones.map(z =>
  `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
     <label style="margin:0"><input type="checkbox" class="zone" value="${z.id}"> ${z.name}</label>
     <button type="button" class="btn btn-outline btn-sm" style="padding:2px 6px; border:none;" onclick="event.preventDefault(); event.stopPropagation(); highlightZone(${z.id})" title="Show on Map">
       <i data-lucide="map-pin" style="width:14px;height:14px;color:var(--primary)"></i>
     </button>
   </div>`).join('');

const map = L.map('map').setView([23.7805, 90.4200], 12);
L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
  maxZoom: 20,
  subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
  attribution: '© Google Maps'
}).addTo(map);

let currentZonePolygon = null;
function highlightZone(id) {
  const zone = mockData.zones.find(z => z.id === id);
  if (!zone) {
    if (window.showToast) showToast('Zone not found', 'error');
    return;
  }
  if (!zone.polygon) {
    if (window.showToast) showToast('Zone boundary data missing. Please do a hard refresh (Ctrl+Shift+R)!', 'error');
    return;
  }

  if (currentZonePolygon) {
    map.removeLayer(currentZonePolygon);
  }
  currentZonePolygon = L.polygon(zone.polygon, {
    color: 'var(--primary)',
    fillColor: 'var(--primary)',
    fillOpacity: 0.15,
    weight: 2
  }).addTo(map).bindPopup('<b>' + zone.name + ' Area</b>').openPopup();
  
  map.fitBounds(currentZonePolygon.getBounds(), { animate: true, duration: 1.5, padding: [20, 20] });
  
  if (window.innerWidth < 768) {
    // on mobile, close the sidebar so the user can see the map
    document.querySelector('.sidebar').classList.remove('sidebar-open');
    document.querySelector('.mobile-filter-btn').classList.remove('active');
  }
}

function getFiltered() {
  const zones = [...document.querySelectorAll('.zone:checked')].map(c => parseInt(c.value));
  const ptypes = [...document.querySelectorAll('.ptype:checked')].map(c => c.value);
  const ltype = document.querySelector('input[name=ltype]:checked').value;

  const budget = parseInt(document.getElementById('budget').value);
  const amens = [...document.querySelectorAll('.amen:checked')].map(c => c.value);
  const sort = document.getElementById('sort').value;

  let r = allListings.filter(l => {
    if (zones.length && !zones.includes(l.zoneId)) return false;
    if (ptypes.length && !ptypes.includes(l.propertyType)) return false;
    if (ltype !== 'all' && l.listingType !== ltype) return false;
    // Gender is no longer filtered from view
    if (l.costs.totalMonthly > budget) return false;
    for (const a of amens) {
      if (Array.isArray(l.amenities)) {
        return false;
      } else if (!l.amenities || !l.amenities[a]) {
        return false;
      }
    }
    return true;
  });
  if (sort === 'cost_asc') r.sort((a,b)=>a.costs.totalMonthly-b.costs.totalMonthly);
  if (sort === 'cost_desc') r.sort((a,b)=>b.costs.totalMonthly-a.costs.totalMonthly);
  if (sort === 'rating') r.sort((a,b)=>b.compositeScore-a.compositeScore);
  return r;
}

function applyFilters() {
  const r = getFiltered();
  document.getElementById('countLabel').textContent = `Showing ${r.length} listings`;
  document.getElementById('listingsGrid').innerHTML = r.map(renderListingCard).join('') || '<p style="color:var(--gray); grid-column: 1/-1; text-align: center; padding: 40px 0;">No listings match your filters.</p>';
  renderListingsOnMap(map, r);
  if (window.lucide) lucide.createIcons();
  
  // Fix for Leaflet gray tiles issue (forces map to recalculate its dimensions)
  setTimeout(() => map.invalidateSize(), 150);
  setTimeout(() => map.invalidateSize(), 500);
}

function resetFilters() {
  document.querySelectorAll('.zone, .ptype, .amen').forEach(c => c.checked = false);
  document.querySelector('input[name=ltype][value=all]').checked = true;

  document.getElementById('budget').value = 15000;
  document.getElementById('budgetVal').textContent = '৳15,000';
  document.getElementById('verifiedOnly').checked = false;
  document.getElementById('sort').value = 'cost_asc';
  applyFilters();
}

document.getElementById('budget').addEventListener('input', e => {
  document.getElementById('budgetVal').textContent = fmt(e.target.value);
});
document.querySelectorAll('.sidebar input, .sidebar select').forEach(el => el.addEventListener('change', applyFilters));

function openCreateListingModal() {
  if (!user) {
    showToast("Please log in first.", "error"); return;
  }
  
  // Check verification via API for everyone
  fetch('api/verif_status.php').then(r=>r.json()).then(d=>{
    if(d.status !== 'approved') {
       showToast("You must submit a verification document in your Profile and wait for Admin approval before listing a property.", "error");
    } else {
      document.getElementById('createListingModal').classList.add('open');
      document.getElementById('lstZone').innerHTML = mockData.zones.map(z => `<option value="${z.id}">${z.name}</option>`).join('');
      document.getElementById('customFeesContainer').innerHTML = ''; 
    }
  }).catch(() => {
    showToast("Failed to check verification status.", "error");
  });
}

function addCustomFee() {
  const container = document.getElementById('customFeesContainer');
  const div = document.createElement('div');
  div.className = 'grid-3 custom-fee-row';
  div.style.alignItems = 'end';
  div.style.marginBottom = '10px';
  div.innerHTML = `
    <div class="form-group" style="margin:0"><label>Fee Name</label><input type="text" class="cf-name" required placeholder="e.g. Cooking Fee"></div>
    <div class="form-group" style="margin:0"><label>Amount (৳)</label><input type="number" class="cf-amount" required min="0"></div>
    <div class="form-group" style="margin:0"><button type="button" class="btn btn-danger btn-block" onclick="this.parentElement.parentElement.remove()">Remove</button></div>
  `;
  container.appendChild(div);
}

async function saveNewListing(e) {
  e.preventDefault();
  const title = document.getElementById('lstTitle').value.trim();
  const zoneId = parseInt(document.getElementById('lstZone').value);
  const propertyType = document.getElementById('lstType').value;
  const totalRooms = parseInt(document.getElementById('lstRooms').value);
  const currentOccupancy = parseInt(document.getElementById('lstOccupancy').value);
  const genderPref = user ? user.gender : 'any';
  const address = document.getElementById('lstAddress').value.trim();
  
  const baseRent = parseInt(document.getElementById('lstBaseRent').value);
  const electricityType = document.getElementById('lstElecType').value;
  const electricityAmount = parseInt(document.getElementById('lstElec').value);
  const gasBill = parseInt(document.getElementById('lstGas').value);
  const waterBill = parseInt(document.getElementById('lstWater').value);
  const internetCost = parseInt(document.getElementById('lstInternet').value);
  const maintenanceFee = parseInt(document.getElementById('lstMaint').value);
  const caretakerFee = parseInt(document.getElementById('lstCaretaker').value);

  const totalMonthly = baseRent + electricityAmount + gasBill + waterBill + internetCost + maintenanceFee + caretakerFee;

  const amenities = {
    attachedBathroom: document.getElementById('lstAmenBath').checked,
    attachedKitchen: document.getElementById('lstAmenKitchen').checked,
    isFurnished: document.getElementById('lstAmenFurnished').checked,
    rooftopAccess: document.getElementById('lstAmenRooftop').checked,
    powerBackup: document.getElementById('lstAmenPower').checked,
    liftAccess: document.getElementById('lstAmenLift').checked,
    parking: document.getElementById('lstAmenParking').checked
  };

  const offsetLat = (Math.random() - 0.5) * 0.008;
  const offsetLng = (Math.random() - 0.5) * 0.008;

  let lat = parseFloat(document.getElementById('lstLat').value);
  let lng = parseFloat(document.getElementById('lstLng').value);
  
  const zoneObj = mockData.zones.find(z => z.id === zoneId);
  if (isNaN(lat) || isNaN(lng)) {
    lat = (zoneObj ? zoneObj.lat : 23.7805) + offsetLat;
    lng = (zoneObj ? zoneObj.lng : 90.4200) + offsetLng;
  }

  // Handle Photo Upload
  let photos = [];
  
  // Upload Thumbnail
  const thumbInput = document.getElementById('lstThumbnail');
  if (thumbInput.files.length > 0) {
    const fd = new FormData();
    fd.append('file', thumbInput.files[0]);
    fd.append('type', 'listing');
    try {
      const upRes = await fetch('api/upload.php', { method: 'POST', body: fd });
      const upData = await upRes.json();
      if (upData.success) {
        photos.push(upData.path);
      } else {
        showToast('Thumbnail upload failed: ' + upData.error, 'error');
        return;
      }
    } catch(err) {
      showToast('Thumbnail upload network error', 'error');
      return;
    }
  }

  // Upload Gallery Photos
  const fileInput = document.getElementById('lstPhoto');
  if (fileInput.files.length > 0) {
    for (let i = 0; i < fileInput.files.length; i++) {
      const fd = new FormData();
      fd.append('file', fileInput.files[i]);
      fd.append('type', 'listing');
      try {
        const upRes = await fetch('api/upload.php', { method: 'POST', body: fd });
        const upData = await upRes.json();
        if (upData.success) {
          photos.push(upData.path);
        } else {
          showToast('Gallery photo upload failed: ' + upData.error, 'error');
          return;
        }
      } catch(err) {
        showToast('Gallery upload network error', 'error');
        return;
      }
    }
  }

  const description = document.getElementById('lstDescription').value.trim();

  const payload = {
    title, zoneId, propertyType, totalRooms, currentOccupancy, genderPref, address, lat, lng,
    description,
    costs: { baseRent, electricityType, electricityAmount, gasBill, waterBill, internetCost, maintenanceFee, caretakerFee, totalMonthly },
    amenities,
    photos // array of paths
  };

  try {
    const res = await fetch('api/listings.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('createListingModal').classList.remove('open');
      document.getElementById('createListingForm').reset();
      showToast('Listing published successfully!');
      if (typeof loadListingsFromDB === 'function') {
        loadListingsFromDB();
      } else {
        location.reload();
      }
    } else {
      showToast(data.error || 'Failed to create listing', 'error');
    }
  } catch (err) {
    showToast('Network error', 'error');
  }
}

const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('zone')) {
  const z = urlParams.get('zone');
  const el = document.querySelector(`.zone[value="${z}"]`);
  if (el) el.checked = true;
}
if (urlParams.get('type')) {
  const t = urlParams.get('type');
  const el = document.querySelector(`.ptype[value="${t}"]`);
  if (el) el.checked = true;
}
if (urlParams.get('budget')) {
  const b = urlParams.get('budget');
  document.getElementById('budget').value = b;
  document.getElementById('budgetVal').textContent = fmt(b);
}

applyFilters();
</script>
</body>
</html>
